<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiTransfer - Rezervasyon Sistemi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #f0f0f0;
            color: #555;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0;
            width: auto;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-btn:hover {
            transform: none;
            box-shadow: none;
            opacity: 0.9;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .message {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        #checkResult {
            display: none;
            margin-top: 20px;
            background: #f8f9ff;
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 20px;
        }

        #checkResult h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 18px;
        }

        #checkResult p {
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 VoiTransfer</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rezervasyon')">📝 Rezervasyon</button>
            <button class="tab-btn" onclick="switchTab('sorgula')">🔍 Sorgula</button>
            <button class="tab-btn" onclick="switchTab('duzenle')">✏️ Düzenle</button>
            <button class="tab-btn" onclick="switchTab('iptal')">❌ İptal</button>
        </div>

        <!-- REZERVASYON PANEL -->
        <div id="tab-rezervasyon" class="tab-panel active">
            <form id="reservationForm">
                <div class="form-group">
                    <label>Voucher (Boş bırakırsa otomatik oluşur)</label>
                    <input type="text" name="voucher" placeholder="BRX200526001">
                </div>
                <div class="form-group">
                    <label>Tarih *</label>
                    <input type="text" name="tarih" placeholder="25.05.2026" required>
                </div>
                <div class="form-group">
                    <label>Operator *</label>
                    <input type="text" name="operator" placeholder="BRIX TRAVEL" required>
                </div>
                <div class="form-group">
                    <label>Job *</label>
                    <select name="job" required>
                        <option value="">Seç</option>
                        <option value="ARRIVAL">ARRIVAL</option>
                        <option value="DEPARTURE">DEPARTURE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>From *</label>
                    <input type="text" name="from" placeholder="AYT" required>
                </div>
                <div class="form-group">
                    <label>To *</label>
                    <input type="text" name="to" placeholder="BELEK" required>
                </div>
                <div class="form-group">
                    <label>Hotel *</label>
                    <input type="text" name="hotel" placeholder="SUENO DELUXE" required>
                </div>
                <div class="form-group">
                    <label>Uçuş *</label>
                    <input type="text" name="ucus" placeholder="PC1801" required>
                </div>
                <div class="form-group">
                    <label>Saat *</label>
                    <input type="text" name="saat" placeholder="14:30" required>
                </div>
                <div class="form-group">
                    <label>Pickup Time</label>
                    <input type="text" name="pickup" placeholder="14:30">
                </div>
                <div class="form-group">
                    <label>Yolcu *</label>
                    <input type="text" name="yolcu" placeholder="Mohammed Ali" required>
                </div>
                <div class="form-group">
                    <label>Telefon *</label>
                    <input type="text" name="telefon" placeholder="+962771234567" required>
                </div>
                <div class="form-group">
                    <label>Yetişkin *</label>
                    <input type="number" name="yetiskin" placeholder="2" required>
                </div>
                <div class="form-group">
                    <label>Çocuk *</label>
                    <input type="number" name="cocuk" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label>Bebek *</label>
                    <input type="number" name="bebek" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label>Fiyat *</label>
                    <input type="text" name="fiyat" placeholder="35" required>
                </div>
                <div class="form-group">
                    <label>Döviz *</label>
                    <select name="döviz" required>
                        <option value="">Seç</option>
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                        <option value="TL">TL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Not</label>
                    <textarea name="not" rows="3" placeholder="VIP transfer"></textarea>
                </div>
                <button type="submit">📝 Rezervasyon Gönder</button>
            </form>
        </div>

        <!-- SORGULA PANEL -->
        <div id="tab-sorgula" class="tab-panel">
            <form id="checkForm">
                <div class="form-group">
                    <label>Voucher No *</label>
                    <input type="text" id="checkVoucher" placeholder="BRX200526001" required>
                </div>
                <button type="submit">🔍 Sorgula</button>
            </form>
            <div id="checkResult"></div>
        </div>

        <!-- DÜZENLE PANEL -->
        <div id="tab-duzenle" class="tab-panel">
            <form id="editForm">
                <div class="form-group">
                    <label>Voucher No *</label>
                    <input type="text" id="editVoucher" placeholder="BRX200526001" required>
                </div>
                <div class="form-group">
                    <label>Alan 1</label>
                    <input type="text" name="field_1" placeholder="Değer 1">
                </div>
                <div class="form-group">
                    <label>Alan 2</label>
                    <input type="text" name="field_2" placeholder="Değer 2">
                </div>
                <div class="form-group">
                    <label>Alan 3</label>
                    <input type="text" name="field_3" placeholder="Değer 3">
                </div>
                <div class="form-group">
                    <label>Alan 4</label>
                    <input type="text" name="field_4" placeholder="Değer 4">
                </div>
                <div class="form-group">
                    <label>Alan 5</label>
                    <input type="text" name="field_5" placeholder="Değer 5">
                </div>
                <div class="form-group">
                    <label>Alan 6</label>
                    <input type="text" name="field_6" placeholder="Değer 6">
                </div>
                <div class="form-group">
                    <label>Alan 7</label>
                    <input type="text" name="field_7" placeholder="Değer 7">
                </div>
                <div class="form-group">
                    <label>Alan 8</label>
                    <input type="text" name="field_8" placeholder="Değer 8">
                </div>
                <div class="form-group">
                    <label>Alan 9</label>
                    <input type="text" name="field_9" placeholder="Değer 9">
                </div>
                <div class="form-group">
                    <label>Alan 10</label>
                    <input type="text" name="field_10" placeholder="Değer 10">
                </div>
                <div class="form-group">
                    <label>Alan 11</label>
                    <input type="text" name="field_11" placeholder="Değer 11">
                </div>
                <button type="submit">✏️ Düzenlemeyi Gönder</button>
            </form>
        </div>

        <!-- İPTAL PANEL -->
        <div id="tab-iptal" class="tab-panel">
            <form id="cancelForm">
                <div class="form-group">
                    <label>Voucher No *</label>
                    <input type="text" id="cancelVoucher" placeholder="BRX200526001" required>
                </div>
                <button type="submit">❌ İptal Talebini Gönder</button>
            </form>
        </div>

        <div id="message" class="message"></div>
    </div>
    
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvqcAXLNyIU0DPrNQQDB3ZcfIsy9pT5STCkZTe-9yQIkED_au6B_ciF_aop_jyTP7ulQ/exec';
        const FLASK_BASE = window.location.origin;

        function switchTab(tab) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }

        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            if (data.job === 'ARRIVAL' && !data.pickup) {
                data.pickup = data.saat;
            }
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    showMessage('✅ Rezervasyon başarıyla eklendi!', 'success');
                    form.reset();
                } else {
                    showMessage('❌ Hata: ' + response.statusText, 'error');
                }
            } catch (error) {
                showMessage('❌ Bağlantı hatası: ' + error.message, 'error');
            }
        });

        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const voucher = document.getElementById('checkVoucher').value.toUpperCase();
            const resultDiv = document.getElementById('checkResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">⏳ Yükleniyor...</div>';
            try {
                const response = await fetch(FLASK_BASE + '/webhook/check?voucher=' + encodeURIComponent(voucher));
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.voucher) {
                        resultDiv.innerHTML = `
                          <div class="status-card">
                            <h3>🎫 VOUCHER: ${data.voucher}</h3>
                            <p><strong>📋 RESERVASİYON BİLGİSİ:</strong></p>
                            <p>👤 Yolcu: ${data.yolcu}</p>
                            <p>📱 Telefon: ${data.telefon}</p>
                            <p>📅 Tarih: ${data.tarih}</p>
                            <p>🛫 Job: ${data.job}</p>
                            <p>🚗 Rotası: ${data.from} → ${data.to}</p>
                            <p>🏨 Hotel: ${data.hotel}</p>
                            <p>✈️ Uçuş: ${data.ucus}</p>
                            <p>🕐 Saat: ${data.saat}</p>
                            <p>👥 Yetişkin: ${data.yetiskin} | Çocuk: ${data.cocuk} | Bebek: ${data.bebek}</p>
                            <p>💰 Fiyat: ${data.fiyat} ${data.döviz}</p>
                            <p style="margin-top: 15px;"><strong>🚗 ŞOFÖR BİLGİSİ:</strong></p>
                            <p>🏢 Firma: ${data.supplier_name || 'Atanmadı'}</p>
                            <p>👤 Şoför: ${data.driver_name || 'Atanmadı'}</p>
                            <p>📱 Şoför Telefon: ${data.driver_phone || 'Atanmadı'}</p>
                            <p>💰 Şoför Fiyatı: ${data.supplier_price || 'Atanmadı'} ${data.supplier_currency || ''}</p>
                            <p style="margin-top: 15px;"><strong>📊 TRANSFER DURUMU:</strong></p>
                            <p>🟢 Status: ${data.status}</p>
                          </div>
                        `;
                    } else {
                        resultDiv.innerHTML = '<p style="color:#721c24">❌ Voucher bulunamadı.</p>';
                    }
                } else {
                    resultDiv.innerHTML = '<p style="color:#721c24">❌ Hata: ' + response.statusText + '</p>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<p style="color:#721c24">❌ Bağlantı hatası: ' + error.message + '</p>';
            }
        });

        document.getElementById('editVoucher').addEventListener('blur', async function() {
            const voucher = this.value.toUpperCase().trim();
            this.value = voucher;
            if (!voucher) return;
            const form = document.getElementById('editForm');
            form.querySelector('[data-prefill-status]') && form.querySelector('[data-prefill-status]').remove();
            const statusEl = document.createElement('p');
            statusEl.setAttribute('data-prefill-status', '1');
            statusEl.style.cssText = 'color:#667eea;font-size:13px;margin-bottom:10px';
            statusEl.textContent = '⏳ Rezervasyon bilgileri yükleniyor...';
            form.insertBefore(statusEl, form.querySelector('.form-group:nth-child(2)'));
            try {
                const resp = await fetch(FLASK_BASE + '/webhook/check?voucher=' + encodeURIComponent(voucher));
                if (resp.ok) {
                    const d = await resp.json();
                    if (d && d.voucher) {
                        const fieldMap = [d.tarih, d.operator, d.job, d.from, d.to, d.hotel, d.ucus, d.saat, d.yolcu, d.telefon, d.fiyat];
                        fieldMap.forEach((val, i) => {
                            const el = form.querySelector(`[name="field_${i+1}"]`);
                            if (el && val !== undefined) el.value = val;
                        });
                        statusEl.style.color = '#155724';
                        statusEl.textContent = '✅ Alanlar dolduruldu. Düzenleyip gönderin.';
                    } else {
                        statusEl.style.color = '#721c24';
                        statusEl.textContent = '❌ Voucher bulunamadı.';
                    }
                } else {
                    statusEl.style.color = '#721c24';
                    statusEl.textContent = '❌ Veri alınamadı: ' + resp.statusText;
                }
            } catch (err) {
                statusEl.style.color = '#721c24';
                statusEl.textContent = '❌ Bağlantı hatası: ' + err.message;
            }
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const voucher = document.getElementById('editVoucher').value.toUpperCase();
            const form = e.target;
            const fields = {};
            for (let i = 1; i <= 11; i++) {
                const el = form.querySelector(`[name="field_${i}"]`);
                if (el) fields[`field_${i}`] = el.value;
            }
            const payload = { voucher, ...fields };
            try {
                const response = await fetch(FLASK_BASE + '/webhook/edit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    showMessage('✅ Düzenleme admin\'e gönderildi!', 'success');
                    form.reset();
                } else {
                    showMessage('❌ Hata: ' + response.statusText, 'error');
                }
            } catch (error) {
                showMessage('❌ Bağlantı hatası: ' + error.message, 'error');
            }
        });

        document.getElementById('cancelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const voucher = document.getElementById('cancelVoucher').value.toUpperCase();
            try {
                const response = await fetch(FLASK_BASE + '/webhook/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voucher })
                });
                if (response.ok) {
                    showMessage('✅ İptal talebi admin\'e gönderildi!', 'success');
                    document.getElementById('cancelVoucher').value = '';
                } else {
                    showMessage('❌ Hata: ' + response.statusText, 'error');
                }
            } catch (error) {
                showMessage('❌ Bağlantı hatası: ' + error.message, 'error');
            }
        });

        async function saveEdit(voucher) {
            const fields = {};
            for (let i = 1; i <= 11; i++) {
                const el = document.querySelector(`[name="field_${i}"][data-voucher="${voucher}"]`);
                if (el) fields[`field_${i}`] = el.value;
            }
            const payload = { voucher, ...fields };
            try {
                const response = await fetch(FLASK_BASE + '/webhook/edit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    showMessage('✅ Düzenleme admin\'e gönderildi!', 'success');
                } else {
                    showMessage('❌ Hata: ' + response.statusText, 'error');
                }
            } catch (error) {
                showMessage('❌ Bağlantı hatası: ' + error.message, 'error');
            }
        }

        async function cancelEdit(voucher) {
            try {
                const response = await fetch(FLASK_BASE + '/webhook/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voucher })
                });
                if (response.ok) {
                    showMessage('✅ İptal talebi admin\'e gönderildi!', 'success');
                } else {
                    showMessage('❌ Hata: ' + response.statusText, 'error');
                }
            } catch (error) {
                showMessage('❌ Bağlantı hatası: ' + error.message, 'error');
            }
        }
        
        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = 'message ' + type;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
